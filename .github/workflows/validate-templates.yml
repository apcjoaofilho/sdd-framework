name: Validate Templates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate templates
        run: python scripts/validate-templates.py
