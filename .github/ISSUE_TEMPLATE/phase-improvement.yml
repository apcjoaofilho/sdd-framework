name: Phase improvement / change
description: Propose adding, removing, or changing a pipeline phase.
labels: ["type:phase-change", "needs:maintainer-review"]
body:
  - type: markdown
    attributes:
      value: |
        Phase changes are high-bar. Please answer all sections — incomplete proposals will be closed.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - Add a new phase
        - Remove an existing phase
        - Modify gate criteria
        - Split / merge phases
        - Other
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What is broken today? Why can't this happen inside an existing phase?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the new/changed phase — input, output, gate.
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: Migration path
      description: How do existing v2.0 users adopt this without breakage?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know the change is complete?
    validations:
      required: true
